<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unidasul ESG Fornecedores</title>
<style>
:root{--paper:#f5f6f3;--card:#fff;--ink:#16241d;--muted:#5d6b63;--line:#dde2db;--brand:#1f5d46;--brand-ink:#fff;--accent:#c98a1b;--bad:#b3261e;--ok:#1f7a4d;--warn:#b26a00}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
.login-box h1{font-size:20px;margin:0 0 4px}
.login-box p{margin:0 0 20px;color:var(--muted)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--brand);color:#eaf3ee;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
nav .logo{font-weight:700;font-size:16px;padding:0 10px 14px}
nav .logo small{display:block;font-weight:400;opacity:.75;font-size:12px}
nav a{color:inherit;text-decoration:none;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between}
nav a:hover{background:rgba(255,255,255,.1)}
nav a.on{background:#fff;color:var(--brand);font-weight:600}
nav a.soon{opacity:.55}
nav a.soon::after{content:"em breve";font-size:11px}
nav .who{margin-top:auto;padding:10px;font-size:13px;opacity:.9}
nav .who button{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
main{padding:24px;min-width:0}
main h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;background:#fafbf9}
.scroll{overflow-x:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 180px}
.row>.btn{flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.stat b{display:block;font-size:22px}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit}
a{color:var(--brand)}a.btn{display:inline-block;text-decoration:none}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#fbeed0;color:#7a5200;font-weight:600}
@media print{nav,.noprint{display:none!important}#app{display:block}main{padding:0}.printonly{display:block!important}body{background:#fff}}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;padding:10px}nav .logo{width:100%;padding-bottom:6px}nav .who{margin:0;width:100%}main{padding:14px}}
</style>
</head>
<body>
<section id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>Unidasul ESG Fornecedores</h1>
    <p>Acesso interno. Entre com seu e-mail e senha.</p>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
    <label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" style="width:100%;margin-top:6px">Entrar</button>
  </form>
</section>

<div id="app" class="hidden">
  <nav id="menu"></nav>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
